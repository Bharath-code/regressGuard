# Example workflow: Run RegressGuard on pull requests.
# Copy this file to your project's .github/workflows/ directory.
#
# Prerequisites:
#   1. Run `rg init` and `rg snapshot` locally first.
#   2. Commit .regressguard/config.json and .regressguard/snapshot.json.
#   3. Ensure your project's dependencies are installed in the workflow.
#
# Require a human to approve baseline changes:
#   The action runs `rg check --base origin/<PR base>`, so a PR that edits
#   .regressguard/snapshot.json to hide a regression still fails (CRITICAL +
#   BASELINE_CHANGED). Add a CODEOWNERS rule so baseline edits need review:
#       /.regressguard/snapshot.json  @your-handle
#   and enable "Require review from Code Owners" in branch protection.
#
# How it works:
#   - The action reads serverUrl and serverCommand from your .regressguard/config.json.
#   - If server-command is provided here, it overrides the config value.
#   - The server runs on the same runner, so localhost works in CI.

name: RegressGuard

on:
  pull_request:
    branches: [main, master]

jobs:
  regression-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lets --base read the snapshot at the PR base ref

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The action reads server-url from .regressguard/config.json by default.
      # Override server-command and server-url below only if your CI setup
      # differs from local development (e.g. different port, different start script).
      - name: Run RegressGuard
        uses: Bharath-code/regressguard@v0
        with:
          # server-command: "npm run dev"       # defaults to serverCommand in config.json
          # server-url: "http://localhost:3000"  # defaults to serverUrl in config.json
          post-comment: "true"
          fail-on-critical: "true"
